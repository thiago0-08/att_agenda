<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="style.css" />
  <title>Lembretes e Tarefas</title>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Lembretes</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-end flex-grow-1">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Features</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Configurações</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <header class="header text-white">
    <h2>Bem-vindo, <strong>Usuário</strong></h2>
    <div class="reminder-message">
      <p>Não se esqueça das suas tarefas!</p>
    </div>
  </header>

  <main class="main-content">
    <div class="container text-center py-4">
      <h5 class="mb-3">Lembretes do Dia</h5>
      <div class="icons-container d-flex flex-wrap justify-content-center gap-3">
        <div class="row w-100">
          <div class="col-4 text-center">
            <img width="50" height="50" src="https://img.icons8.com/fluency/50/calendar.png" alt="Calendário" />
            <p>Calendário</p>
          </div>
          <div class="col-4 text-center">
            <img width="50" height="50" src="https://img.icons8.com/fluency/50/reminder.png" alt="Lembretes" />
            <p>Lembretes</p>
          </div>
          <div class="col-4 text-center">
            <img width="50" height="50" src="https://img.icons8.com/fluency/50/todo-list.png" alt="Tarefas" />
            <p>Tarefas</p>
          </div>
        </div>
        <div class="row w-100 mt-3">
          <div class="col-4 text-center">
            <img width="50" height="50" src="https://img.icons8.com/fluency/50/add.png" alt="Adicionar Tarefa" />
            <p>Nova Tarefa</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>

</html>
