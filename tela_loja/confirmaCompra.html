<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Compra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar sticky-top bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
           
            <a class="navbar-brand" href="#">Troca de Tokens</a>
            <div class="dropdown" data-bs-theme="dark">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <img width="24" height="24" src="https://img.icons8.com/ios/50/chip--v1.png" alt="chip--v1" />
                </button>
                <ul class="dropdown-menu">
                    <li>
                        <div class="alert alert-primary m-2" role="alert">
                            Você possui 0 Tokens
                        </div>
                    </li>
                </ul>
            </div>
            <a href="../tela_inicial/index.html">
                <img width="24" height="24" src="https://img.icons8.com/ios/50/exit--v1.png" alt="exit--v1" />
            </a>
        </div>
    </nav>
    <div class="container text-center mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <img src="https://images-americanas.b2w.io/produtos/4052458970/imagens/gift-card-google-play-30-reais/4052458970_1_large.jpg" 
                        class="card-img-top p-3" alt="Google Play R$30">
                </div>
            </div>
            <div class="col-md-5">
                <div class="card shadow-sm h-100 d-flex flex-column justify-content-center p-4">
                    <h3 class="card-title text-center">Google Play Gift Card</h3>
                    <p class="card-text text-center"><strong>Preço:</strong> <span class="text-success">R$100 tokens</span></p>
                    <p class="titulo text-center"><strong>Descrição</strong></p>
                    <ul class="list-unstyled text-center">
                        <li>Gift Card para compras na Google Play.</li>
                    </ul>
                    <div class="text-center mt-3">
                        <div id="liveAlertPlaceholder"></div>
                        <button type="button" class="btn btn-primary" id="liveAlertBtn">Comprar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<Script>
    const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
const appendAlert = (message, type) => {
  const wrapper = document.createElement('div')
  wrapper.innerHTML = [
    `<div class="alert alert-${type} alert-dismissible" role="alert">`,
    `   <div>${message}</div>`,
    '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
    '</div>'
  ].join('')

  alertPlaceholder.append(wrapper)
}

const alertTrigger = document.getElementById('liveAlertBtn')
if (alertTrigger) {
  alertTrigger.addEventListener('click', () => {
    appendAlert('Parabens Você trocou seus tokens pelo Gift Card de R$20.00 com sucesso! seu cogido chegara por mensagem em ate 5 dias uteis' , 'success')
  })
}
</Script>

</html>
