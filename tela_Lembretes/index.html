<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Layout Aprimorado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
  <a href="../tela_inicial/index.html">
  <Button class="button"> Voltar</Button>
</a>
    <div class="container">
        <h2 class="text-center mb-4">📅 Minha Agenda</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>Adicionar Tarefa</h4>
                    <form>
                        <div class="mb-3">
                            <label for="task" class="form-label">Tarefa</label>
                            <input type="text" id="task" class="form-control" placeholder="Digite a tarefa">
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Data</label>
                            <input type="date" id="date" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>📌 Tarefas</h4>
                    <ul class="list-group task-list">
                        <li class="list-group-item">✔️ Estudar JavaScript</li>
                        <li class="list-group-item">✔️ Reunião às 15h</li>
                        <li class="list-group-item">🔄 Enviar relatório</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>🔔 Adicionar Lembrete</h4>
                    <form>
                        <div class="mb-3">
                            <label for="reminder" class="form-label">Lembrete</label>
                            <input type="text" id="reminder" class="form-control" placeholder="Digite o lembrete">
                        </div>
                        <div class="mb-3">
                            <label for="reminder-time" class="form-label">Horário</label>
                            <input type="time" id="reminder-time" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Lembrete</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h4>⏰ Lembretes</h4>
                    <ul class="list-group reminder-list">
                        <li class="list-group-item">🔔 Beber água às 10h</li>
                        <li class="list-group-item">🔔 Revisão do projeto às 18h</li>
                        <li class="list-group-item">🔔 Fazer exercício às 20h</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
