<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Calendário</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <!-- Google Font Link for Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script src="script.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="text-center p-3">
  <div class="header-container">
    <a href="../tela_inicial/index.html">
      <button class="btn btn-dark mb-3">Voltar</button>
    </a>
    <h1 class="mb-4">Calendário</h1>
  </div>
  <div class="wrapper mx-auto">
    <header class="d-flex justify-content-between align-items-center mb-3">
      <p class="current-date fw-bold"></p>
      <div class="icons">
        <span id="prev" class="material-symbols-rounded">chevron_left</span>
        <span id="next" class="material-symbols-rounded">chevron_right</span>
      </div>
    </header>
    <div class="calendar">
      <ul class="weeks list-unstyled d-flex justify-content-between">
        <li>Dom</li>
        <li>Seg</li>
        <li>Ter</li>
        <li>Qua</li>
        <li>Qui</li>
        <li>Sex</li>
        <li>Sab</li>
      </ul>
      <ul class="days list-unstyled d-flex flex-wrap"></ul>
    </div>
  </div>
</body>
</html>
